body:
  text: 姚秦三藏法師鳩摩羅什譯姚秦釋僧肇注夫理歸中道二諦為宗何者萬法之生皆假因緣而有生滅流謝浮僞不實稱之為俗也因緣諸法皆無自性自性既無因緣都忘本自不生今則無滅體極無改目之為真真俗為二理審為諦聖心正觀鑒真照俗此當中道法相之解稱為般若般若慧也金剛者堅利之譬也堅則物莫能沮利故無物不摧以況斯慧邪惡不能毀堅之極也本惑皆破利之義也波羅蜜者到彼岸也生死為此涅槃為彼大士乘無相慧捨此生死到彼涅槃矣經由津通義也言由理生理經言顯學者神悟從理教而通矣此經本體空慧為主略存始終凡有三章初訖尊重弟子明境空也意在語境未言於慧第二正名辨慧即明慧空但語慧空未及行人第三種問以下明菩薩空也三章之初其文各現前後相似意不同矣四時般若此最為初言約義豐幽旨難見敢以野陋輒為注解述其大略非云曲盡詳析究密請俟明識者矣如是佛臨泥洹時侍者請曰一切經首皆致何等佛敕阿難應言如是乃至時衆也如我所傳如佛所說稱如是也我聞若從他傳聞不必如是我親承金口而聞事非謬矣一謂是自聞當理以不自不當理傳之何為言則當理理亦如言言理不差故言一也時雖曰當理容不得時若不得時何能悟人明聖不虗說言必會機時哉之說也佛在舍衛國法王行運應物而遊一時降集在舍衛大城憍薩羅國之也祗樹給孤獨園須達市園祗陀施樹共立精舍故言祗樹給孤獨園也市疏作布字與大比丘衆千二百五十人俱聖化無私聽必有儔俱聞如林可信明矣應有四衆略而不載者耳私疏作祕爾時世尊食時日營資膳食熟之時此時人家皆有施心易生著衣著僧伽梨福田衣也佛觀良田乘齊整因命侍者出家之人一切福田凡製僧那唯此為之欲令顧惟道無空信施之也乘疏作區塍持鉢執應器也入舍衛大城乞食法身無待何須何欲且人天妙供日盈現行分衛福物宜之也現疏作自福物宜作福物之宜於其城中次第乞已還至本處不越貧與富不捨賤從貴大慈平等次第至也飯食訖收衣鉢洗足已敷座而坐將陳般若遵拭自敷時長老須菩提在大衆中即從座起偏袒右肩右膝著地合掌恭敬夫神鍾雖朗非扣而不鳴聖不孤應影響唯仁師尊道重故尅敬盡恭也神鍾疏作巨鐘尅作克而白佛言希有世尊慈恩之重豈可勝言如來善護念諸菩薩善付囑諸菩薩護念付囑即希有事也慈善將衛令其行令護念也行立道成委授弘通付囑也世尊善男子善女人發阿耨多羅三藐三菩提心菩提一切智也標意擬向遠期正覺故言發心之也意疏作心應云何住云何降伏其心菩提妙果非行不就萬行雖曠解有明昧故有位降之異始則抑心就理漸習自調謂之降伏終能契解會宗心不移去謂之為住耳位疑住字佛言善哉善哉須菩提如汝所說如來善護念諸菩薩善付囑諸菩薩讚諸之儀當理會機盡善之甚誠如所言諸疏作請汝今諦聽當為汝說善男子善女人發阿耨多羅三藐三菩提心應如是住如是降伏其心若聽不審則漏言遺理或令諦聽言理弗虗也或疏作誡唯然世尊願樂欲聞慈戒許說敬肅傾心戒疏作誡佛告須菩提諸菩薩摩訶薩應如是降伏其心虗心履道謂之菩薩曠濟萬物摩訶薩也應如下所說則是降伏之方也問降在後而答在前何耶住深降淺故問者標深於初降淺易習故答之於前問答有指非其謬也所有一切衆生之類若卵生若胎生若濕生若化生若有色若無色若有想若無想若非有想非無想我皆令入無餘涅槃而滅度之正答降伏之行也萬法雖曠略為二科一衆生法二五陰法法不自起因緣故生但是因緣自性皆無斯則順理為解乖宗成惑惑故生死流轉解則纍滅無為身心為苦苦盡為樂盡苦之道其唯大解解極惑盡身心俱忘寂然永樂謂之滅度非我弘化群生豈濟凡解不自生要由漸習假名法粗抑心則易故始就衆生空以明降伏也皆無作皆空惑故作惑即解則作即如是滅度無量無數無邊衆生實無衆生得滅度者解會中道不有不無無性故不有假名則不無非無假名故恆度衆生自性空故實無滅者矣何以故須菩提若有我相人相衆生相壽者相即非菩薩釋何故無滅者若有我相可言有滅既無我人其誰滅乎但是假名而橫計我執我為非忘我為是是非既彰得失明矣也復次須菩提菩薩於法應無所住行於布施所謂不住色布施不住聲香味觸法布施次答住行即明法空謂法彌曠略舉內則六度外為六塵內外諸法斯皆因緣無性因緣無性則心無停處故應無住也捨心無吝謂之布施無相可存何吝之有施為六度之首塵為法生之基二法皆空于何不盡既得法空解明行立無復退失故言住也基疏作機須菩提菩薩應如是布施不住於相結成住義也施者受者財物皆不可得不住相也何以故若菩薩不住相布施其福德不可思量釋何故布施應不住相耶正以虗心而施則福不可量故知不住為是住相為非又理既無量心不應限稱理行施故其福彌曠者乎須菩提於意云何東方虗空可思量不不也世尊須菩提南西北方四維上下虗空可思量不不也世尊須菩提菩薩無住相布施福德亦復如是不可思量理極二空降住已彰理行既顯時聽戢心如說而行其福為多為多之況齊乎太虗之矣須菩提菩薩但應如所教住聖言無謬理不可越但當如佛所教而安心也須菩提於意云何可以身相見如來不菩薩發心義兼三端一化衆生二修萬行三向菩提降伏已明化物之儀辨住則示修行之軌此章明趣菩提之方如來身相即菩提之體若識法身則菩提可登若計實菩提乖之遠矣故問法身明菩提空者乎之體疏作果體計實菩提作計性實菩提二字無故問作故舉不也世尊不可以身相得見如來須菩提深識法身故言不可以實身相而見也實字疏無何以故如來所說身相即非身相即引佛語而釋也法身者萬善之極體含萬善妙集成身緣構無性故即非身佛告須菩提凡所有相皆是虗妄即述成須菩提之言也又則虗妄理非相也又假名故虗實計為妄乎若見諸相非相則見如來行合解通則為見佛須菩提白佛言世尊頗有衆生得聞如是言說章句生實信不理空無相奇心無所時聽昧然未即於心示同未悟咨問云爾訖法尚應捨何況非法以信驗理身奇疏作寄佛言須菩提莫作是說聖不空言稟悟如流方問有是何言也如來滅後後五百歲有持戒修福者此於章句能生信心以此為實後五百歲像法之中人衰道喪尚有信者況今大聖感興英慧雲集從化如林何謂無信乎後世能信要具戒德今之未悟無福愚暗自為疑滯非理不實之也當知是人不於一佛二佛三四五佛而種善根已於無量千萬佛所種諸善根見佛聞法積德已久然後能信明法之深妙也聞是章句乃至一念生淨信者須菩提如來悉知悉見是諸衆生得如是無量福德即以如來知見明理非虗一念淨信其福無量推功測理豈不信之乎何以故是諸衆生無復我相人相衆生相壽者相釋一念至促而福德無量何耶政以無或我人理解為弘無法相亦無非法相無因緣法相亦無無因緣之非法相何以故是諸衆生若心取相則為著我人衆生壽者我人橫計理故宜忘諸法是理何故復無耶正以心緣四大假名諸法而計我人見假名空我人息矣故應無也若取法相即著我人衆生壽者若取色聲香等實法相者亦起我人等見故應無之耳何以故若取非法相即著我人衆生壽者釋何故復無非法耶緣空故有有由有故空空若無有相雲起起相計我萬或慈生矣或慈應作惑茲是故不應取法不應取非法并結無法相無非法相也空有兩忘心無所取解會平等結盡道成以是義故如來常說汝等比丘知我說法如筏喻者法尚應捨何況非法即引昔說以證今理也譬欲濟河搆筏自運既登彼岸棄筏而去將度生死假乘萬行既到涅槃萬善俱捨道法尚捨而況非法之空也之空二字疏無須菩提於意云何如來得阿耨多羅三藐三菩提耶如來有所說法耶竟尊重弟子引衆聖同解以證理之必然須菩提言如我解佛所說義無有定法名阿耨多羅三藐三菩提亦無有定法如來可說如我於佛所說義中而作解窮相盡謂之菩提無相故不有假名則不無不有不無何實可得何定可說也窮相之上疑脫解字何以故如來所說法皆不可取不可說菩提無相可取諸法空不可說故無定實非法非非法非法則不有非非法故不無有無並無理之極也有無之上疏有故不可說四字所以者何一切賢聖皆以無為法而有差別理無生滅謂之無為無為之理衆聖同解解會無為結盡道成所謂一解脫義同入法性者也然無為雖一解有明昧明深昧淺優劣差者也須菩提於意云何若人滿三千大千世界七寶以用布施是人所得福德寧為多不須菩提言甚多世尊又格功德即以明理功德既多故宜弘也何以故是福德即非福德性是故如來說福德多福德無性可以因緣增多多則易差故即遣之耳若復有人於此經中受持乃至四句偈等為他人說其福勝彼積寶多而功薄四句約而福厚何以故須菩提一切諸佛及諸佛阿耨多羅三藐三菩提法皆從此經出何以故四句約而功勝耶金玉三千正以養身四句雖約妙極資神豈可同日而等彼者也正疏作止須菩提所謂佛法者即非佛法愛佛功德七住未忘妙著難覺宜應虗心也須菩提於意云何須陀洹能作是念我得須陀洹果不例訪衆聖求之諸心優劣雖異忘懷必同須菩提言不也世尊何以故須陀洹名為入流海為衆流之川菩提神極之淵始會無生終必盡源而無所入理無乖順何入之有不入色聲香味觸法是名須陀洹違理故入色聲背色聲則會於理理會無入非入色聲也自下衆果類可知須菩提於意云何斯陀含能作是念我得斯陀含果不須菩提言不也世尊何以故斯陀含名一往來而實無往來是名斯陀含須菩提於意云何阿那含能作是念我得阿那含果不須菩提言不也世尊何以故阿那含名為不來而無不來是故名阿那含須菩提於意云何阿羅漢能作是念我得阿羅漢道不須菩提言不也世尊何以故實無有法名阿羅漢世尊若阿羅漢作是念我得阿羅漢道即為著我人衆生壽者阿羅漢者無生也相滅生盡謂之無生若計念則見我人起相受生非謂羅漢諸果類亦應爾但隨義異明耳世尊佛說我得無諍三昧人中最為第一是第一離欲阿羅漢以己所解驗理非虗心宣恆靜諍從何起宣疏作空我不作是念我是離欲阿羅漢世尊若作是念我得阿羅漢道世尊則不說須菩提是樂阿蘭那行者阿蘭那行者寂靜行也相盡於外心息於內內外俱寂何時不靜也以須菩提實無所行而名須菩提是樂阿蘭那行得名不虗必積實也積疏稱佛告須菩提於意云何如來昔於然燈佛所於法有所得不不也世尊如來在然燈佛所於法實無所得次明菩薩其解亦同須菩提於意云何菩薩莊嚴佛土不菩薩自行嚴土化人嚴國之義亦在虗心不也世尊何以故莊嚴佛土者即非莊嚴是名莊嚴相或必土穢虗明則國淨或疏作惑是故須菩提諸菩薩摩訶薩應如是生清淨心理極於此結勸修明不應住色生心不應住聲香味觸法生心應無所住而生其心不封六塵相滅解生須菩提譬如有人身如須彌山王於意云何是身為大不須菩提言甚大世尊何以故佛說非身是名大身解洹虗通猶身假能大也洹疑恆字須菩提如恆河中所有沙數如是沙等恆河於意云何是諸恆河沙寧為多不須菩提言甚多世尊但諸恆河尚多無數何況其沙須菩提我今實言告汝若有善男子善女人以七寶滿爾所恆河沙數三千大千世界以用布施得福多不須菩提言甚多世尊佛告須菩提若善男子善女人於此經中乃至受持四句偈等為他人說而此福德勝前福德第二廣格復次須菩提隨說是經乃至四句偈等當知此處一切世間天人阿修羅皆應供養如佛塔廟封賓法身謂之為塔樹像靈堂稱之為廟聖體神儀全在四句獻供致敬宜盡厥心矣賓疑殯字何況有人盡能受持讀誦四句已爾況乎始終須菩提當知是人成就最上第一希有之法法妙人勝理故宜然若是經典所在之處即為有佛若尊重弟子人能弘法則人有法以法成人則法有人人法所處理令弘矣初章訖之也令弘疏作當貴爾時須菩提白佛言世尊當何名此經夫修散難究本一易尋會宗領旨宜正其名也修疏作條我等云何奉持尊修為奉任弘為持在三成範請聞其軌尊疏作遵佛告須菩提是經名為金剛般若波羅蜜名貫首題義已修矣然境慧相從通名波若取要宜歸乎聖心貫首題疏作冠題首修疏作備以是名字汝當奉持契經舉目苓合義從名正理顯宜應修弘經疏作綱苓作詮弘作習所以者何須菩提佛說般若波羅蜜即非般若波羅蜜釋所以此名字而奉持者何夫名不虗設必當其實金剛所擬物莫不碎此慧所照法無不空則非般若即慧空也境滅慧忘何相不盡弘持之旨宜存於此乎須菩提於意云何如來有所說法不須菩提白佛言世尊如來無所說境慧都空復何所說須菩提於意云何三千大千世界所有微塵是為多不須菩提言甚多世尊須菩提諸微塵如來說非微塵是名微塵如來說世界非世界是名世界散為微塵合成世界無性故非假名則是則是疏即有須菩提於意云何可以三十二相見如來不不也世尊不可以三十二相得見如來何以故如來說三十二相即是非相是名三十二相世界宅也如來主也如來出道王三千主宅皆空其誰說法乎出下疑脫世字須菩提若有善男子善女人以恆河沙等身命布施若復有人於此經中乃至受持四句偈等為他人說其福甚多身命布施不免有生弘持四句纍滅道成爾時須菩提聞說是經深解義趣餐名服旨妙悟解襟涕淚悲泣嗟我晚悟兼悲未聞而白佛言希有世尊佛說如是甚深經典我從昔來所得慧眼未曾得聞如是之經資神之寶曠代難聞深慶自幸加難及人難疑歎字世尊若復有人得聞是經信心清淨則生實相聞妙不疑不解必真不解不疑生字當知是人成就第一希有功德解生纍滅人德之高也世尊是實相者則是非相是故如來說名實相虗盡實忘理之極也世尊我今得聞如是經典信解受持不足為難遇佛成聖方信何難若當來世後五百歲其有衆生得聞是經信解受持是人則為第一希有道敗時信此最可稱何以故此人無我相人相衆生相壽者相上士虗心故為希有所以者何我相即是非相人相衆生相壽者相即是非相有封為或無封為解解為第一所以希有也或疑惑字何以故離一切諸相則名為佛相盡解極則是為佛故知惑見我人解則無矣佛告須菩提如是如是若復有人得聞是經不驚不怖不畏當知是人甚為希有何以故須菩提如來說第一波羅蜜即非第一波羅蜜是名第一波羅蜜述成須菩提之言如汝所說是而非虗也須菩提忍辱波羅蜜如來說非忍辱波羅蜜即以忍辱明無我人安耐為忍加毀為辱無我人誰加誰忍故非忍之也無上疏有既字何以故須菩提如我昔為歌利王割截身體我於爾時無我相無人相無衆生相無壽者相何故忍即非忍耶即引忍事以為證也有人受割可名為忍既無我人割忍何生也何以故我於往昔節節支解時若有我相人相衆生相壽者相應生瞋恨何故爾時無我人相耶若有我人必生忿恚而能怡然無我人明矣怡疏恬須菩提又念過去於五百世作忍辱仙人於爾所世無我相無人相無衆生相無壽者相事理非虗重引益明是故須菩提菩薩應離一切相發阿耨多羅三藐三菩提心菩提以相盡為極故宜以忘懷而期心也不應住色生心不應住聲香味觸法生心離一切相者不住色聲等也應生無所住心無相可緣心何所住若心有住則為非住住相則心動故非住是故佛說菩薩心不應住色布施還舉前宗會以成義政以理無所住故應忘心而布施也施不住色無財物也須菩提菩薩為利益一切衆生應如是布施施不望報利益必深如來說一切諸相即是非相諸相皆無不見施者又說一切衆生則非衆生既非衆生受者亦無須菩提如來是真語者實語者如語者不誑語者不異語者真不僞實無虗如必當理不誑則非忘語不異則始終恆一聖言不謬故宜修行也忘疏作妄須菩提如來所得法此法無實無虗寄實以非虗何實之可得須菩提若菩薩心住於法而行布施如人入暗則無所見住相非曉則實若夜遊實疏作冥若菩薩心不住法而行布施如人有目日光明照見種種色無或三事則不住相也慧見為目理鏡為日萬行顯別為種種色鏡疏作境須菩提當來之世若有善男子善女人能於此經受持讀誦則為如來以佛智慧悉知是人悉見是人皆得成就無量無邊功德如來所見理周非謬明勸將來宜加修勤也周疏作用修勤作勤修須菩提若有善男子善女人初日分以恆河沙等身布施中日分復以恆河沙等身布施後日分亦以恆河沙等身布施如是無量百千萬億劫以身布施分一日為三分故言初中後分也施重又多功德彌曠矣若復有人聞此經典信心不逆其福勝彼施則有限信心無極何況書寫受持讀誦為人解說但言已信況復持弘者也已疏作以持弘作弘持須菩提以要言之是經有不可思議不可稱量無邊功德理圓道極言不盡美提宗表實約言之耳物莫能測不思議也笇數不姟不稱量也蕩然無崖無邊也取要言之備此三句笇姟疏作算該如來為發大乘者說為發最上乘者說廣運無崖謂之大乘三乘之勝謂之最上自非其人不謬說也若有人能受持讀誦廣為人說如來悉知是人悉見是人皆得成就不可量不可稱無有邊不可思議功德人高道曠唯佛見之如是人等則為荷擔如來阿耨多羅三藐三菩提千載不墜由於人弘住持運行荷擔義也住疏作任何以故須菩提若樂小法者著我見人見衆生見壽者見則於此經不能聽受讀誦為人解說何故人能荷擔耶心虗解曠道軍必強也須菩提在在處處若有此經一切世間天人阿修羅所應供養當知此處則為是塔皆應恭敬作禮圍繞以諸華香而散其處地是無知法處故貴道在於人而不寧乎寧疑尊字復次須菩提善男子善女人受持讀誦此經若為人輕賤是人先世罪業應墮惡道以今世人輕賤故先世罪業則為消滅罪起由惑福生於解福解既積宿殃矣殃下疏有滅字當得阿耨多羅三藐三菩提纍滅解生菩提可登也須菩提我念過去無量阿僧祇劫於然燈佛前得值八百四千萬億那由他諸佛悉皆供養承事無空過者若復有人於後末世能受持讀誦此經所得功德於我所供養諸佛功德百分不及一千萬億分乃至算數譬喻所不能及心限則福曠則功多福下疏有少意二字功下亦有德字須菩提若善男子善女人於後末世有受持讀誦此經所得功德我若具說者或有人聞心則狂亂狐疑不信解通人曠德必無崖狂亂不信足以明道足上脫不字須菩提當知是經義不可思議萬行淵深義能難測難疏作誰果報亦不可思議菩提妙果豈有心之所議第二章訖爾時須菩提白佛言世尊善男子善女人發阿耨多羅三藐三菩提心云何應住云何降伏其心此第三章明菩薩空也夫解不頓生教亦有漸何者始開衆生空法空明境空也次辨般若則非即慧空也此下云實無有法發菩提者即行人空也又更料辨二行始終之義始習衆生空為降伏終得法空為住然此二空十地未窮唯佛乃盡是為十地通有始終降住之義故衆生空以有自降住法空亦爾是為初地之住則是二地之降降亦住也住亦降也重問之旨義兼於此何以知之舉二行為兩問混一空而併答一空始終降住備矣事以逍遙而非重出雖幽開難啓善拂易開豈敢獨悟實希共曉則非二字疑衍有自疑寫倒幽開疑幽關啓疑啓字佛告須菩提善男子善女人發阿耨多羅三藐三菩提心者當生如是心我應滅度一切衆生滅度一切衆生已而無有一衆生實滅度者何以故須菩提若菩薩有我相人相衆生相壽者相則非菩薩何故無滅者以失明得理可知矣見我則非忘我為是既無我人豈得有滅也所以者何須菩提實無有法發阿耨多羅三藐三菩提心者所以有我相則非菩薩者何我法則我能發心無發心者故知無我計我為或故非菩薩也無發心者即行人空也或疏作惑須菩提於意云何如來於然燈佛所有法得阿耨多羅三藐三菩提不即引自得記之解以證今記自下疏有昔字今記作前說不也世尊如我解佛所說義佛於然燈佛所無有法得阿耨多羅三藐三菩提聖心難測義推可圖得記由於無相無相之中則無所得也佛言如是如是須菩提實無有法如來得阿耨多羅三藐三菩提須菩提若有法如來得阿耨多羅三藐三菩提者然燈佛則不與我授記汝於來世當得作佛號釋迦牟尼若見有法則乖菩提何容得記以實無有法得阿耨多羅三藐三菩提是故然燈佛與我授記作是言汝於來世當得作佛號釋迦牟尼無法則會理會理則向極故得記也何以故如來者即諸法如義何以故無法便得記耶諸法性空理無乖異謂之為如會如解極故名如來有相則違無相則順順必之極故宜得記之也若有人言如來得阿耨多羅三藐三菩提若說有如來得菩提者此俗聞人語非理中言也聞疏作間須菩提實無有法佛得阿耨多羅三藐三菩提佛人也菩提道也既無人法誰得菩提乎須菩提如來所得阿耨多羅三藐三菩提於是中無實無虗向來辨有得為非無得為是寄是以明非非謂有是尋言著是故復遣之是非既盡則會菩提菩提之中不見是非非實則無是非虗無非也是故如來說一切法皆是佛法凡夫以違一切法理為耶聖人以順一切法理為正正則覺悟故皆佛法者矣耶疏邪須菩提所言一切法者即非一切法是故名一切法一切法以何為理而言皆佛法耶諸法緣假自性皆無如假會而解者名得一切法理為悟佛法矣如假二字疑剩須菩提譬如人身長大須菩提言世尊如來說人身長大則為非大身是名大身旨舉人身類上諸法緣假故長大無性則非身即又況下菩薩觀衆生如身假名則可度無自性故無滅者若見實衆生而欲化者則非菩薩者矣旨疏作直即字疑衍須菩提菩薩亦如是若作是言我當滅度無量衆生則不名菩薩合譬也無衆生而橫見衆生猶無身而見身耳見則乖道非菩薩者也無衆生上疏有元字何以故須菩提無有法名為菩薩菩薩自無何有衆生是故佛說一切法無我無人無衆生無壽者收結上義也以無菩薩亦無衆生一切法都無我人也須菩提若菩薩作是言我當莊嚴佛土是不名菩薩虗矜進道嚴土濟物濟物之行方便慧也解空無相謂之為慧緣假不著謂之方便若言我能莊嚴國土衆生可化見惑違道何名菩薩之耳襟疏作襟何以故如來說莊嚴佛土者即非莊嚴是名莊嚴無存於化而土自嚴須菩提若菩薩通達無我法者如來說名真是菩薩解通非僞真菩薩也解通疏作通達須菩提於意云何如來有肉眼不如是世尊如來有肉眼須菩提於意云何如來有天眼不如是世尊如來有天眼須菩提於意云何如來有慧眼不如是世尊如來有慧眼須菩提於意云何如來有法眼不如是世尊如來有法眼須菩提於意云何如來有佛眼不如是世尊如來有佛眼相盡照極五眼淨矣道成由乎行立淨國本於化物國淨則化周五眼必道極化周本願備矣如來一念照達三世何用五眼之異乎於化境別為立耳眼必下恐脫淨字須菩提於意云何如恆河中所有沙佛說是沙不如是世尊如來說是沙須菩提於意云何如一恆河中所有沙有如是沙等恆河是諸恆河所有沙數佛世界如是寧為多不甚多世尊佛告須菩提爾所國土中所有衆生若干種心如來悉知五眼照極理無不周略舉色心於境盡矣心從緣起識了多端故若干種也於疏作收何以故如來說諸心皆為非心是名為心言必當理故解無不周也所以者何須菩提過去心不可得現在心不可得未來心不可得所以說非心名心者何以三世心無性可得故可從緣而生心須菩提於意云何若有人滿三千大千世界七寶以用布施是人以是因緣得福多不世尊此人以是因緣得福甚多須菩提若福德有實如來不說得福德多以福德無故如來說得福德多金玉無性故可積滿三千大千福德無實則可曠施而多心之無性惑滅解生矣大千二字疏無須菩提於意云何佛可以具足色身見不不也世尊如來不應以具足色身見何以故如來說具足色身即非具足色身是名具足色身須菩提於意云何如來可以具足諸相見不不也世尊如來不應以具足諸相見何以故如來說諸相具足即非具足是名諸相具足慧為萬善之主施為衆行之首因備道成理之必然總為丈六金容別則衆相之姿妙集非有故身感構隨現則為相豈可一方而盡極乎須菩提汝勿謂如來作是念我當有所說法莫作是念道成應出說法化人也何以故若人言如來有所說法即為謗佛不能解我所說故謬傳毀聖名為謗佛須菩提說法者無法可說是名說法教傳者說法之意也向言無說非杜默而不語也但無存而說則說滿天下無乖法理之過矣爾時慧命須菩提白佛言世尊頗有衆生於未來世聞說是法生信心不佛言須菩提彼非衆生非不衆生何以故須菩提衆生衆生者如來說非衆生是名衆生此六十二字肇本無之天台疏亦無科判然諸本皆有此文故且存之須菩提白佛言世尊佛得阿耨多羅三藐三菩提為無所得耶佛人也菩提道也佛得道故說示人而言無法可說未審佛得道不也示上疏有以字佛言如是如是須菩提我於阿耨多羅三藐三菩提乃至無有少法可得是名阿耨多羅三藐三菩提相盡虗通謂之菩提菩提無相有何可得寂滅無得道之至也復次須菩提是法平等無有高下是名阿耨多羅三藐三菩提結成菩提義也人無貴賤法無好醜蕩然平等菩提義也以無我無人無衆生無壽者修一切善法則得阿耨多羅三藐三菩提夫形端故影直聲和則嚮順忘我人而修因必尅無相之菩提也須菩提所言善法者如來說即非善法是名善法人既不有善何得實須菩提若三千大千世界中所有諸須彌山王如是等七寶聚有人持用布施若人以此般若波羅蜜經乃至四句偈等受持讀誦為他人說於前福德百分不及一百千萬億分乃至算數譬喻所不能及聚寶有盡妙解無窮也須菩提於意云何汝等勿謂如來作是念我當度衆生須菩提莫作是念菩提以無得為果教以忘言而說時聽唯疑理未悟心故呵之勿謂如來見衆生作念而欲化之耳何以故實無有衆生如來度者何故勿謂作念耶以如來不見有衆生可度也若有衆生如來度者如來則有我人衆生壽者若見有衆生則為我見何謂如來耶須菩提如來說有我者則非有我但說假名我耳非實我也而凡夫之人以為有我聞說假名不達言旨以為實我須菩提凡夫者如來說則非凡夫凡夫不實故可化而成聖須菩提於意云何可以三十二相觀如來不疑者謂衆生是有可化而成聖法身不無可以妙相而期故問之云爾也須菩提言如是如是以三十二相觀如來聽者實爾用三十二相是如來而觀求也佛言須菩提若以三十二相觀如來者轉輪聖王則是如來即以近事質之令其自解須菩提白佛言世尊如我解佛所說義不應以三十二相觀如來時情謂然我解不爾爾時世尊而說偈言若以色見我以音聲求我是人行邪道不能見如來金容煥眼而非形八音盈耳而非聲偏謬為邪愚隔不見也金容疏作五色須菩提汝若作是念如來不以具足相故得阿耨多羅三藐三菩提須菩提莫作是念如來不以具足相故得阿耨多羅三藐三菩提不偏在色聲故向言非非不身相故復言是之也須菩提汝若作是念發阿耨多羅三藐三菩提者說諸法斷滅莫作是念何以故發阿耨多羅三藐三菩提心者於法不說斷滅相相盡寂滅故不有道王十方非謂無應畢而謝則不常滅至隨現故不斷體令中軌物之拭也而限之一方豈不謬滅至疏作感至令中作合中道三字拭作式謬下有哉字須菩提若菩薩以滿恆河沙等世界七寶持用布施若復有人知一切法無我得成於忍此菩薩勝前菩薩所得功德何以故須菩提以諸菩薩不受福德故忘我則忍成超出故勝也須菩提白佛言世尊云何菩薩不受福德須菩提菩薩所作福德不應貪著是故說不受福德期報鍾已名貪著無存我人取染何生須菩提若有人言如來若來若去若坐若臥是人不解我所說義一時般若文理粗周然上來所說事分言散故更略始結終領會大宗也如來道蔭之主世界權之宅衆生慈育之子舉此三事大旨彰矣若計有實人履行而至為來運盡之滅故去處現優化則坐臥此但都形滯迹不及道也權字下疏有應字都疑覩字何以故如來者無所從來亦無所去故名如來何故見去來坐臥不解義耶解極會如體無方所緣至物見來無所從感畢為隱亦何所去而云來去亦不乖乎須菩提若善男子善女人以三千大千世界碎為微塵於意云何是微塵衆寧為多不甚多世尊何以故若是微塵衆實有者佛則不說是微塵衆所以者何佛說微塵衆則非微塵衆是名微塵衆世尊如來所說三千大千世界則非世界是名世界微塵非實故可碎而為多世界非有則可假借而成也何以故若世界實有者則是一合相何故非世界名世界耶若是實有應一性合而不可分也如來說一合相則非一合相是名一合相假衆為一無合可得耳須菩提一合相者則是不可說假名無體不可定說但凡夫之人貪著其事癡惑則凡夫貪著故計實癡疏作疑須菩提若人言佛說我見人見衆生見壽者見須菩提於意云何是人解我所說義不不也世尊是人不解如來所說義此辨無實衆生可化如來但稱諸見為邪不言見體是實若人報言佛說諸見是實者謬取佛意非謂解也何以故世尊說我見人見衆生見壽者見即非我見人見衆生見壽者見是名我見人見衆生見壽者見諸見非實可改為正衆生虗假凡至聖也凡上疏有從字須菩提發阿耨多羅三藐三菩提心者於一切法應如是知如是見始終既畢故旨宗以勸人也凡欲發心成佛淨國土化衆生當如上所說理而生知見之也旨疏作指如是信解理深未明政應推信為解不生法相但是虗假非實法也須菩提所言法相者如來說即非法相是名法相窮理盡明其唯如來說言非實故應從信矣須菩提若有人以滿無量阿僧祇世界七寶持用布施若有善男子善女人發菩提心者持於此經乃至四句偈等受持讀誦為人演說其福勝彼七寶有竭四句無窮云何為人演說不取於相如如不動末示弘宣之義也夫道不正不足授人中心疑者其辭枝說當於如故言如如始終不易不可動也何以故一切有為法如夢幻泡影如露亦如電應作如是觀浮僞不實理之皆空空無異易故如如不動也佛說是經已長老須菩提及諸比丘比丘尼優婆塞優婆夷一切世間天人阿修羅聞佛所說皆大歡喜信受奉行道蘊聖心待孚則彰宿感冥構不謀而集同聽齊悟法喜蕩心服玩遵拭永崇不朽也喜疏作喜拭作式
