front:
  text: 注金剛經序金龍沙門敬雄撰曩昔慈覺大師之入于支那也齎持晉肇公注金剛經而歸祕諸名山光明不照世也殆九百年矣頃祖芳禪人持來告曰是乃祖請來之本豫偶得之請師校而梓之使見聞者結般若種子焉豫受而讀半乃掩卷歎曰夫此經者般若第九會直示無住生心妙旨故云為發最上乘者說蓋一切菩薩未有不學般若成無上菩提者故彌勒天親無著功德施四大菩薩造之偈論讚揚弘通法流乎支那羅什初譯肇公乃注從時厥後奉為日課者亦多矣且黃梅印心曹溪悟道靈瑞之著注疏之多宜莫此經若也而其注之舊肇公為先注來於大東亦此注為先而發諸注既行之殿者豈非時節因緣乎天台大師曾講此經專依肇公猶如說觀經專依淨影也故今每有疑誤輒依天台疏以校讎焉嗟乎斯注者天台所欽用慈覺所請來文古義幽深得佛意且投好略機實苦海津梁迷塗司南也梓而行之則其利益復如何哉故隨喜以校亦願後之讀此注者因指得月悟無住生心妙旨則與黃梅曹溪同一鼻孔出氣不必紛紛更從事於後世異說而哆以為博也寶曆十二壬午之夏
